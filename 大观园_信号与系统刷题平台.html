故陈述错误，选 **B**。`},{id:"ss-c1-04",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"广义导数与冲激筛选",type:"single",difficulty:3,tags:["2021年837真题","广义导数","阶跃求导"],source:"广东工业大学2021年837全国统考真题第1题",stem:"计算广义导数 $\\frac{d}{dt} \\left\\{ [\\cos(2t) + \\sin(t)] \\varepsilon(t) \\right\\}$ 的化简结果为：",options:[{key:"A",text:"$[-2\\sin(2t) + \\cos(t)]\\varepsilon(t)$"},{key:"B",text:"$[-2\\sin(2t) + \\cos(t)]\\varepsilon(t) + \\delta(t)$"},{key:"C",text:"$[-2\\sin(2t) + \\cos(t)]\\varepsilon(t) + 2\\delta(t)$"},{key:"D",text:"$\\delta(t)$"}],answer:"B",analysis:`【核心考点】：含阶跃跃变信号的广义微积分法则。

1. 根据乘积微分法则：
   $$\\frac{d}{dt}[f(t)\\varepsilon(t)] = f'(t)\\varepsilon(t) + f(t)\\frac{d\\varepsilon(t)}{dt} = f'(t)\\varepsilon(t) + f(t)\\delta(t)$$

   - 设 $f(t) = \\cos(2t) + \\sin(t)$；

故选 **B**。`},{id:"ss-c1-07",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"时移冲激二次多项式筛选",type:"single",difficulty:2,tags:["2023年837真题","冲激筛选","基础送分"],source:"广东工业大学2023年837全国统考真题第1题",stem:"计算广义定积分 $\\int_{-\\infty}^\\infty (t^2 - 3t + 2)\\delta(t - 2) \\, dt$ 的数值为：",options:[{key:"A",text:"0"},{key:"B",text:"2"},{key:"C",text:"-2"},{key:"D",text:"4"}],answer:"A",analysis:`【核心考点】：时移冲激函数 $\\delta(t - t_0)$ 的积分筛选性质。

综上，该系统为**非线性、时不变系统**。选 **B**。`},{id:"ss-c1-10",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"指数衰减信号能量计算",type:"single",difficulty:2,tags:["2023年837真题","能量信号","积分计算"],source:"广东工业大学2023年837全国统考真题第3题",stem:"计算单边实指数衰减信号 $f_1(t) = e^{-2t}\\varepsilon(t)$ 的总能量 $E$ 与平均功率 $P$ 分别为：",options:[{key:"A",text:"$E = \\frac{1}{4}\\text{ J}, \\, P = 0\\text{ W}$"},{key:"B",text:"$E = \\frac{1}{2}\\text{ J}, \\, P = 0\\text{ W}$"},{key:"C",text:"$E = \\infty, \\, P = \\frac{1}{4}\\text{ W}$"},{key:"D",text:"$E = 1\\text{ J}, \\, P = 0\\text{ W}$"}],answer:"A",analysis:`【核心考点】：连续信号能量 $E$ 与平均功率 $P$ 的定义公式。

   $$P = \\lim_{T \\to \\infty} \\frac{1}{T} \\int_{-T/2}^{T/2} |f(t)|^2 dt = 0$$
选 **A**。`},{id:"ss-c1-11",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"虚指数信号功率计算",type:"single",difficulty:2,tags:["绝杀32专题","功率信号","复指数模长"],source:"通信考研绝杀32专题系列之专题4",stem:"计算连续复指数信号 $f_2(t) = e^{j(2t + \\frac{\\pi}{4})}$ 的能量与平均功率：",options:[{key:"A",text:"$E = \\infty, \\, P = 1\\text{ W}$"},{key:"B",text:"$E = 1\\text{ J}, \\, P = 0\\text{ W}$"},{key:"C",text:"$E = \\infty, \\, P = \\frac{1}{2}\\text{ W}$"},{key:"D",text:"$E = \\infty, \\, P = 2\\text{ W}$"}],answer:"A",analysis:`【核心考点】：复指数信号的模长性质与功率计算。

因此该信号属于标准的**功率信号**。选 **A**。`},{id:"ss-c1-12",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"初始状态微分系统线性判断",type:"judgment",difficulty:3,tags:["2025年809真题","微分方程","零输入线性"],source:"广东工业大学2025年809全国统考真题第2题",stem:"判断系统 $\\frac{df(t)}{dt} + 3f(t) + 5y(0_-) = 0$ 满足线性系统的定义（具有线性性质）。",options:[{key:"A",text:"正确（True）"},{key:"B",text:"错误（False）"}],answer:"A",analysis:`【核心考点】：动态系统的零输入线性与零状态线性。

2. 该常微分方程中，$f(t)$、其导数项 $\\frac{df(t)}{dt}$ 以及初始状态项 $y(0_-)$ 均严格为一次线性组合，不存在乘方或非线性运算。

故陈述正确，选 **A**。`},{id:"ss-c1-13",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"因果系统判定",type:"single",difficulty:2,tags:["经典真题","因果性","反折非因果"],source:"广东工业大学837/809真题高频题",stem:"在以下输入输出对应关系中，属于因果系统（Causal System）的是：",options:[{key:"A",text:"$y(t) = f(2t)$"},{key:"B",text:"$y(t) = f(t - 2) + f(t)$"},{key:"C",text:"$y(t) = f(t + 1)$"},{key:"D",text:"$y(t) = f(-t)$"}],answer:"B",analysis:`【核心考点】：因果系统的物理定义。

1. 因果系统的本质特征是：系统在任意时刻 $t_0$ 的输出响应，只取决于**当前时刻 $t_0$ 和过去时刻 $t < t_0$** 的输入激励，绝不能取决于**未来时刻 $t > t_0$** 的输入。
2. 逐项检验：
   - A: $y(t) = f(2t)$，当 $t = 1$ 时，$y(1) = f(2)$ 取决于未来值，非因果；
   - B: $y(t) = f(t - 2) + f(t)$，输出仅取决于过去时刻 $t - 2$ 和当前时刻 $t$，完全不依赖未来值，是**因果系统**！
   - C: $y(t) = f(t + 1)$，明显超前 1 个时间单位，非因果；
   - D: $y(t) = f(-t)$，当 $t = -2$ 时，$y(-2) = f(2)$ 取决于未来时刻的值，非因果。
故选 **B**。`},{id:"ss-c1-14",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"积分器系统BIBO稳定性",type:"judgment",difficulty:3,tags:["2019年837真题","BIBO稳定","积分器不稳定"],source:"广东工业大学2019年837统考真题",stem:"理想积分器系统 $y(t) = \\int_{-\\infty}^t f(\\tau) \\, d\\tau$ 是 BIBO（有界输入有界输出）稳定系统。",options:[{key:"A",text:"正确（True）"},{key:"B",text:"错误（False）"}],answer:"B",analysis:`【核心考点】：连续 LTI 系统的 BIBO 稳定性判据。

1. 连续 LTI 系统 BIBO 稳定的充要条件是其冲激响应 $h(t)$ 必须在全时域**绝对可积**：
   $$\\int_{-\\infty}^{+\\infty} |h(t)| \\, dt < \\infty$$
2. 对于理想积分器，令输入为 $f(t) = \\delta(t)$，其冲激响应为单位阶跃函数：
   $$h(t) = \\int_{-\\infty}^t \\delta(\\tau) d\\tau = \\varepsilon(t)$$
3. 对其冲激响应积分：
   $$\\int_{-\\infty}^{+\\infty} |h(t)| dt = \\int_0^{+\\infty} 1 \\, dt = \\infty$$
   不满足绝对可积条件。
4. 反例举证：输入有界信号 $f(t) = \\varepsilon(t)$（$|f(t)| \\le 1$ 有界），输出为斜坡信号 $y(t) = t \\varepsilon(t)$，当 $t \\to \\infty$ 时 $y(t) \\to \\infty$ 发散无界！
因此理想积分器**不是**稳定系统。本题陈述错误，选 **B**。`},{id:"ss-c1-15",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"有限区间冲激筛选积分",type:"single",difficulty:2,tags:["2020年837真题","冲激筛选","经典易错"],source:"广东工业大学2020年837全国统考真题第1题",stem:"计算广义定积分 $\\int_{-1}^2 (2t^2 - 2t)\\delta(t - 1) \\, dt$ 的值为：",options:[{key:"A",text:"0"},{key:"B",text:"2"},{key:"C",text:"-2"},{key:"D",text:"4"}],answer:"A",analysis:`【核心考点】：冲激函数的有限区间筛选性质。

3. 代入筛选性质公式：
   $$\\int_{-1}^2 f(t)\\delta(t - 1)dt = f(1)$$
4. 计算函数值：
   $$f(1) = 2(1)^2 - 2(1) = 2 - 2 = 0$$
故原积分值为 **0**。选 **A**。`},{id:"ss-c1-16",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"冲激乘积与零信号",type:"single",difficulty:2,tags:["2020年837真题","冲激乘积","零信号"],source:"广东工业大学2020年837全国统考真题第2题",stem:"计算时域表达式 $t\\delta(t) * [\\delta(t) - \\delta(t - 3)]$ 的化简结果为：",options:[{key:"A",text:"0"},{key:"B",text:"$\\delta(t)$"},{key:"C",text:"$t\\delta(t)$"},{key:"D",text:"$-3\\delta(t - 3)$"}],answer:"A",analysis:`【核心考点】：自变量与冲激函数的乘积性质。

   $$0 * [\\delta(t) - \\delta(t - 3)] = 0$$
故化简结果恒为 **0**。选 **A**。`},{id:"ss-c1-17",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"负无穷到正无穷冲激筛选",type:"single",difficulty:2,tags:["2018年837真题","冲激积分","原点筛选"],source:"广东工业大学2018年837全国统考真题第1题",stem:"计算广义积分 $\\int_{-\\infty}^\\infty (t^2 - 2)\\delta(t) \\, dt$ 的值为：",options:[{key:"A",text:"-2"},{key:"B",text:"0"},{key:"C",text:"2"},{key:"D",text:"-4"}],answer:"A",analysis:`【核心考点】：原点冲激函数 $\\delta(t)$ 的标准筛选性质。

故正确答案为 **A**。`},{id:"ss-c1-18",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"区间外冲激积分等于零",type:"single",difficulty:2,tags:["2025年809真题","冲激区间","易错防坑"],source:"广东工业大学2025年809全国统考真题第1题",stem:"计算广义积分 $\\int_{-2}^2 \\delta\\left(\\frac{t}{4} - 1\\right) \\, dt$ 的值为：",options:[{key:"A",text:"0"},{key:"B",text:"4"},{key:"C",text:"1"},{key:"D",text:"$\\frac{1}{4}$"}],answer:"A",analysis:`【核心考点】：冲激函数作用点与积分区间的从属关系。

   奇函数在关于原点对称的区间 $[-\\infty, +\\infty]$ 上的积分为零：

   在时刻 $n$，输出 $y[n]$ 包含了 $x[n-1]$（依赖过去的输入值），因此系统**具有记忆（有记忆系统）**；
2. **因果性（Causality）**：
   输出 $y[n]$ 仅取决于当前时刻 $n$ 和过去时刻 $n - 1$ 的输入，完全不依赖未来时刻（如 $n + 1$）的输入，因此为**因果系统**；

   方程第二项 $\\frac{1}{x[n-1]}$ 中输入信号出现在分母上，违背齐次性 $T[a x] \\ne a T[x]$，因此为**非线性系统**。

1. **基本分解公式**：
   任何连续信号 $f(t)$ 均可唯一分解为偶分量 $f_e(t)$ 与奇分量 $f_o(t)$ 之和：
   $$f(t) = f_e(t) + f_o(t)$$

   $$f_e(t) = \\frac{1}{2}[f(t) + f(-t)]$$
   $$f_o(t) = \\frac{1}{2}[f(t) - f(-t)]$$

1. **核心原则**：“只对时间自变量 $t$ 本身进行代换”。
2. **分析步骤**：
   - 第一步（平移）：将 $f(t)$ 沿时间轴**向左平移 $t_0$**，得到：
     $$f_1(t) = f(t + t_0)$$
   - 第二步（展缩与反折）：将自变量 $t$ 替换为 $-at$，直接得到：
     $$f_1(-at) = f(-at + t_0) = f(t_0 - at)$$

   - 若采用“先展缩反折、后平移”：先将 $f(t)$ 变为 $f(-at)$，再将 $t$ 整体右移 $\\frac{t_0}{a}$，替换 $t \\to t - \\frac{t_0}{a}$，得到 $f(-a(t - \\frac{t_0}{a})) = f(-at + t_0)$。

1. **序列非零区间分析**：
   - $f_1(k)$ 的非零点为 $k = 0, 1, 2$，对应数值 $f_1(0)=3, f_1(1)=2, f_1(2)=1$；

2. **计算 $k = 3$ 处的卷积值**：
   由离散卷积定义公式 $f(3) = \\sum_{m=-\\infty}^\\infty f_1(m)f_2(3 - m)$：

   - 当 $m = 2$ 时：$f_1(2) f_2(1) = 1 	imes 1 = 1$；
   - 其余各项乘积均为 0；
3. **求和结果**：
   $$f(3) = 4 + 1 = 5$$
故正确答案为 **B**。`},{id:"ss-c2-02",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"全响应分解定理",type:"single",difficulty:3,tags:["2023年837真题","零输入响应","零状态响应"],source:"广东工业大学2023年837全国统考真题第2题",stem:"某 LTI 连续系统，当初始状态不变、输入为 $f_1(t)$ 时，全响应 $y_1(t) = 2e^{-t} + e^{-2t}$；当输入变为 $2f_1(t)$ 时，全响应为 $y_2(t) = 2e^{-t} + 2e^{-2t}$。若输入为零（仅有原初始状态），则系统的零输入响应 $y_{zi}(t)$ 为：",options:[{key:"A",text:"$2e^{-t}$"},{key:"B",text:"$e^{-2t}$"},{key:"C",text:"$2e^{-t} - e^{-2t}$"},{key:"D",text:"$e^{-t} + e^{-2t}$"}],answer:"A",analysis:`【核心考点】：线性时不变系统的全响应线性分解特性。

1. 根据 LTI 系统的全响应分解原理：
   $$y(t) = y_{zi}(t) + y_{zs}(t)$$

   零状态响应 $y_{zs}(t)$ 与输入激励成严格的正比例线性关系。
2. 建立线性方程组：
   - 第一次激励 $f_1(t)$：$y_{zi}(t) + y_{zs1}(t) = 2e^{-t} + e^{-2t}$    (式 1)
   - 第二次激励 $2f_1(t)$：$y_{zi}(t) + 2y_{zs1}(t) = 2e^{-t} + 2e^{-2t}$   (式 2)

   - 用 (式 2) 减去 (式 1)：$y_{zs1}(t) = e^{-2t}$；

故零输入响应为 **A**。`},{id:"ss-c2-03",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"离散指数卷积和",type:"single",difficulty:3,tags:["2021年837真题","离散卷积公式","等比求和"],source:"广东工业大学2021年837全国统考真题第4题",stem:"计算离散序列卷积和 $[(0.2)^k \varepsilon(k)] * [(0.4)^k \varepsilon(k)]$ 的化简解析式为：",options:[{key:"A",text:"$[2(0.4)^k - (0.2)^k]\varepsilon(k)$"},{key:"B",text:"$[(0.4)^k - (0.2)^k]\varepsilon(k)$"},{key:"C",text:"$[2(0.4)^k - 2(0.2)^k]\varepsilon(k)$"},{key:"D",text:"$5[(0.4)^{k+1} - (0.2)^{k+1}]\varepsilon(k)$"}],answer:"A",analysis:`【核心考点】：单边指数阶跃序列的卷积公式。

1. 经典离散卷积公式（$a 
e b$ 时）：
   $$(a^k \varepsilon[k]) * (b^k \varepsilon[k]) = \frac{a^{k+1} - b^{k+1}}{a - b}\varepsilon[k]$$
2. 代入 $a = 0.4, \\, b = 0.2$：
   $$y(k) = \frac{(0.4)^{k+1} - (0.2)^{k+1}}{0.4 - 0.2}\varepsilon[k] = \frac{0.4(0.4)^k - 0.2(0.2)^k}{0.2}\varepsilon[k]$$

1. **求特征根与齐次解形式**：
   特征方程 $\x07lpha - 0.5 = 0 \\implies \x07lpha = 0.5$；
   齐次解形式为 $C (0.5)^k$；
2. **零输入响应 $y_{zi}(k)$**：
   由无激励方程 $y(k) - 0.5y(k-1) = 0$：
   当 $k = 0$ 时，$y_{zi}(0) = 0.5 y(-1) = 0.5 	imes 2 = 1$；
   由于 $y_{zi}(k) = C_{zi}(0.5)^k$，故 $C_{zi} = 1 \\implies y_{zi}(k) = (0.5)^k \varepsilon(k)$；
3. **零状态响应 $y_{zs}(k)$**：
   特解设为常数 $K$：$K - 0.5K = 1 \\implies K = 2$；
   全零状态解 $y_{zs}(k) = 2 + C_{zs}(0.5)^k$；

   $$y_{zs}(k) = [2 - (0.5)^k]\varepsilon(k)$$

   $$y(n) = 1 + 1 + 1 = 3$$
故在 $n \\ge 2$ 时其数值恒为 **3**。选 **A**。`},{id:"ss-c2-14",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"串联系统总冲激响应",type:"single",difficulty:1,tags:["2024年809真题","串联连接","时域卷积"],source:"广东工业大学2024年809全国统考真题第8题",stem:"由若干个线性时不变子系统串联组成的复合系统，其总冲激响应是各子系统冲激响应的：",options:[{key:"A",text:"卷积（Convolution）"},{key:"B",text:"代数相乘（Multiplication）"},{key:"C",text:"代数相加（Addition）"},{key:"D",text:"复频域相加"}],answer:"A",analysis:`【核心考点】：LTI 系统的基本级联连接性质。

3. 由时域卷积的结合律：
   $$y(t) = f(t) * [h_1(t) * h_2(t)]$$
4. 因此串联系统的等效总冲激响应等于各子系统冲激响应的**时域卷积** $h(t) = h_1(t) * h_2(t)$。
选 **A**。`},{id:"ss-c2-15",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"零状态与强迫响应概念辨析",type:"judgment",difficulty:2,tags:["2024年809真题","自然响应","强迫响应"],source:"广东工业大学2024年809全国统考真题第11题",stem:"若一个系统的初始状态为零，则该系统的零状态响应必定只包含强迫响应（受迫响应），不包含任何自然响应（固有响应）。",options:[{key:"A",text:"正确（True）"},{key:"B",text:"错误（False）"}],answer:"B",analysis:`【核心考点】：全响应两种不同分解方式的交织辨析。

1. **按激励源分解**：全响应 = 零输入响应 $y_{zi}(t)$ + 零状态响应 $y_{zs}(t)$；
2. **按函数形式分解**：全响应 = 自然响应（具有系统特征根函数形式） + 强迫响应（具有外加激励函数形式）；
3. **关键关系**：
   - 零输入响应 $y_{zi}(t)$ 完全由特征根组成，全属于自然响应；
   - 但**零状态响应 $y_{zs}(t)$ 同样同时包含自然响应分量与强迫响应分量**！只有在初始状态为零且外加特征根激励的极端特殊情况下才会全部合并。
   - 正常情况下，$y_{zs}(t) = y_{zs, 	ext{nat}} + y_{zs, 	ext{forced}}$。
故题中陈述“零状态响应必定只包含强迫响应”是错误的。选 **B**。`},{id:"ss-c2-obh-01",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"时移因果指数时域卷积积分",type:"single",difficulty:3,tags:["奥本海姆经典","连续卷积","分段积分"],source:"奥本海姆《信号与系统》(第2版)课后习题2.21",stem:"计算连续时间卷积积分 $y(t) = [e^{-2t}u(t)] * u(t - 2)$ 的闭式解析表达式为：",options:[{key:"A",text:"$\\frac{1}{2}[1 - e^{-2(t - 2)}]u(t - 2)$"},{key:"B",text:"$\\frac{1}{2}[1 - e^{-2t}]u(t - 2)$"},{key:"C",text:"$[1 - e^{-2(t - 2)}]u(t - 2)$"},{key:"D",text:"$\\frac{1}{2}[1 - e^{-2(t - 2)}]u(t)$"}],answer:"A",analysis:`【核心考点】：时移阶跃信号的卷积积分与时不变平移性质。

1. **法一：先算基准卷积再时移**：
   - 设 $y_0(t) = [e^{-2t}u(t)] * u(t)$；
   - 信号与阶跃卷积即对信号进行时域积分：
     $$y_0(t) = \\int_0^t e^{-2\\tau}d\\tau = \\left[ -\\frac{1}{2}e^{-2\\tau} \\right]_0^t = \\frac{1}{2}(1 - e^{-2t})u(t)$$
   - 第二个信号为时移信号 $u(t - 2)$，时延 $t_0 = 2$；

1. 当连续信号在某点存在第一类可去/跳变间断点时，利用有限项傅氏级数或有限带宽滤波近似重构，在跳变点两翼必然出现超调尖峰；

   $$\\frac{1}{\\pi}\\int_0^\\pi \\frac{\\sin x}{x}dx - \\frac{1}{2} \\approx 0.089490$$

   $$\frac{d}{dz}\\left( \frac{z}{z - a} \right) = \frac{(z - a) - z}{(z - a)^2} = -\frac{a}{(z - a)^2}$$

1. 考察数字角频率平移 $2\\pi$：

3. 所以恒有：
   $$X(e^{j(\\Omega + 2\\pi)}) = X(e^{j\\Omega})$$
4. 因此 DTFT 的频谱必然是**以 $2\\pi$ 为周期的连续频域函数**。

3. 若极点为 $r e^{j	heta}$，则零点为 $\frac{1}{r e^{-j	heta}} = \frac{1}{r}e^{j	heta}$，模长为 $\frac{1}{r} > 1$，严格位于单位圆外部的共轭径向射线延长线上；
4. 这种几何对称性保证了在单位圆上矢量长度比值恒为常数，从而保持幅频响应恒等于 1。
故陈述正确，选 **A**。`},{id:"ss-c5-14",subject:"广工837/809-信号与系统",chapter:"第五章：Z变换与离散系统",section:"部分分式展开求逆Z变换",type:"single",difficulty:3,tags:["逆Z变换","部分分式","除z展开法"],source:"广东工业大学837典型计算题",stem:"求象函数 $F(z) = \frac{z}{(z - 1)(z - 2)}$（因果收敛域 $|z| > 2$）的逆 Z 变换 $f(k)$：",options:[{key:"A",text:"$[2^k - 1]\varepsilon(k)$"},{key:"B",text:"$[1 - 2^k]\varepsilon(k)$"},{key:"C",text:"$[2^{k+1} - 1]\varepsilon(k)$"},{key:"D",text:"$[2^k + 1]\varepsilon(k)$"}],answer:"A",analysis:`【核心考点】：离散 Z 变换的“除以 $z$ 部分分式展开法”。

   - $B = \\left[ \frac{1}{z - 1} \right]_{z = 2} = \frac{1}{2 - 1} = 1$；

   $$F(z) = -\frac{z}{z - 1} + \frac{z}{z - 2}$$
4. 查标准因果逆变换对：
   - $\frac{z}{z - 1} \\leftrightarrow \varepsilon(k)$；

   $$X(e^{j\\Omega}) = \\sum_{n=-N_1}^{N_1} 1 \\cdot e^{-j\\Omega n}$$

   $$X(e^{j\\Omega}) = e^{j\\Omega N_1} \\frac{1 - (e^{-j\\Omega})^{2N_1 + 1}}{1 - e^{-j\\Omega}} = \\frac{e^{j\\Omega(N_1 + 1/2)} - e^{-j\\Omega(N_1 + 1/2)}}{e^{j\\Omega/2} - e^{-j\\Omega/2}}$$

1. **求系统函数 $H(z)$ 与输入 $F(z)$**：
   $$H(z) = \\frac{1}{1 - 0.5z^{-1}} = \\frac{z}{z - 0.5}$$
   $$F(z) = \\frac{z}{z - 0.5}$$

   $$Y_{zs}(z) = H(z)F(z) = \\frac{z^2}{(z - 0.5)^2}$$

   - 方式一：两边除以 $z$：$\\frac{Y_{zs}(z)}{z} = \\frac{z}{(z - 0.5)^2} = \\frac{1}{z - 0.5} + \\frac{0.5}{(z - 0.5)^2}$；

   $$A(1) > 0$$

   $$H(s) = \frac{1}{\\Delta} \\sum_{k} P_k \\Delta_k$$

   $$\\Delta = 1 - \\sum L_i + \\sum L_i L_j - \\sum L_i L_j L_k + \\dots$$

   - $\\sum L_i L_j$ 为两两互不接触回路的增益乘积之和；

1. **状态方程**：由一阶常微分方程组组成，描述内部状态变量向量 $\\mathbf{x}(t)$ 的时域变化率：
   $$\\dot{\\mathbf{x}}(t) = \\mathbf{A}\\mathbf{x}(t) + \\mathbf{b}f(t)$$
   其中 $\\mathbf{A}$ 为 $n 	imes n$ 系统矩阵，$\\mathbf{b}$ 为输入向量；
2. **输出方程**：由代数方程组成，描述系统外部输出 $y(t)$ 与当前状态和当前输入的代数映射：
   $$y(t) = \\mathbf{c}^T \\mathbf{x}(t) + d f(t)$$
   其中 $\\mathbf{c}^T$ 为输出向量，$d$ 为直接传输标量。

1. 对状态方程取拉普拉斯变换（零状态）：
   $$s \\mathbf{X}(s) = \\mathbf{A}\\mathbf{X}(s) + \\mathbf{b}F(s) \\implies (s\\mathbf{I} - \\mathbf{A})\\mathbf{X}(s) = \\mathbf{b}F(s)$$
2. 求解状态向量：
   $$\\mathbf{X}(s) = (s\\mathbf{I} - \\mathbf{A})^{-1}\\mathbf{b}F(s)$$
3. 对输出方程取拉氏变换：
   $$Y(s) = \\mathbf{c}^T \\mathbf{X}(s) + d F(s) = [\\mathbf{c}^T(s\\mathbf{I} - \\mathbf{A})^{-1}\\mathbf{b} + d] F(s)$$
4. 两边除以输入 $F(s)$ 得系统函数：
   $$H(s) = \frac{Y(s)}{F(s)} = \\mathbf{c}^T(s\\mathbf{I} - \\mathbf{A})^{-1}\\mathbf{b} + d$$
选 **A**。`},{id:"ss-c6-04",subject:"广工837/809-信号与系统",chapter:"第六章：系统状态变量与信号流图",section:"状态变量选取原则",type:"single",difficulty:2,tags:["状态变量","物理电路","独立储能"],source:"广东工业大学837基础概念",stem:"在集中参数动态电路系统中，选取状态变量的标准物理原则通常是选取：",options:[{key:"A",text:"各独立电容的电压 $u_C$ 与各独立电感的电流 $i_L$"},{key:"B",text:"各电阻两端的端电压 $u_R$"},{key:"C",text:"输入电压源与电流源的大小"},{key:"D",text:"电路中任意节点的电位"}],answer:"A",analysis:`【核心考点】：电路网络状态变量的物理本质与选取准则。

2. 在电网络中，储能元件为电容（电场储能 $W_E = \frac{1}{2}C u_C^2$）和电感（磁场储能 $W_M = \frac{1}{2}L i_L^2$）；
3. 且根据换路定则，电容电压 $u_C$ 与电感电流 $i_L$ 不能突变，连续记忆系统状态；

选 **A**。`},{id:"ss-c6-05",subject:"广工837/809-信号与系统",chapter:"第六章：系统状态变量与信号流图",section:"离散系统直接II型框图状态",type:"single",difficulty:3,tags:["直接II型","典范型","延迟单元"],source:"广东工业大学837/809经典真题",stem:"对于二阶离散系统，直接 II 型（Direct Form II，又称典范型/规范型）结构相比于直接 I 型结构的最显著工程优势是：",options:[{key:"A",text:"所需单位延迟单元（$z^{-1}$ 存储器）数量减半，达到理论最少个数"},{key:"B",text:"不需要任何加法器"},{key:"C",text:"系统绝对不会产生溢出失真"},{key:"D",text:"只能用于全通滤波器"}],answer:"A",analysis:`【核心考点】：离散系统直接 II 型（Canonical Form 典范型）结构特性。

1. 构造特征矩阵 $s\\mathbf{I} - \\mathbf{A}$：
   $$s\\mathbf{I} - \\mathbf{A} = s \begin{bmatrix} 1 & 0 \\ 0 & 1 \\end{bmatrix} - \begin{bmatrix} 0 & 1 \\ -2 & -3 \\end{bmatrix} = \begin{bmatrix} s & -1 \\ 2 & s + 3 \\end{bmatrix}$$
2. 计算行列式：
   $$\\det(s\\mathbf{I} - \\mathbf{A}) = s(s + 3) - (-1)(2) = s^2 + 3s + 2$$
3. 特征方程令为零：
   $$s^2 + 3s + 2 = (s + 1)(s + 2) = 0 \\implies s_1 = -1, \\, s_2 = -2$$
故极点为 $-1$ 和 $-2$。选 **A**。`},{id:"ss-c6-09",subject:"广工837/809-信号与系统",chapter:"第六章：系统状态变量与信号流图",section:"单回路反馈梅森公式",type:"single",difficulty:2,tags:["反馈控制","闭环增益","单回路"],source:"广东工业大学837/809经典基础题",stem:"前向通路增益为 $G(s)$、负反馈支路增益为 $H_b(s)$ 的典型负反馈控制系统，其闭环传递函数为：",options:[{key:"A",text:"$\frac{G(s)}{1 + G(s)H_b(s)}$"},{key:"B",text:"$\frac{G(s)}{1 - G(s)H_b(s)}$"},{key:"C",text:"$\frac{1}{1 + G(s)H_b(s)}$"},{key:"D",text:"$G(s)[1 + H_b(s)]$"}],answer:"A",analysis:`【核心考点】：闭环负反馈系统的梅森公式推导。

1. 只有一条前向通路：$P_1 = G(s)$；
2. 只有一个负反馈回路：由于反馈为负，回路增益为 $L_1 = -G(s)H_b(s)$；
3. 特征行列式：
   $$\\Delta = 1 - L_1 = 1 - [-G(s)H_b(s)] = 1 + G(s)H_b(s)$$
4. 回路与前向通路相接触，其余子式 $\\Delta_1 = 1$；
5. 由梅森公式：
   $$H(s) = \frac{P_1 \\Delta_1}{\\Delta} = \frac{G(s)}{1 + G(s)H_b(s)}$$
选 **A**。`},{id:"ss-c6-10",subject:"广工837/809-信号与系统",chapter:"第六章：系统状态变量与信号流图",section:"状态变量微分积分器对应",type:"single",difficulty:2,tags:["模拟框图","积分器输出","状态空间"],source:"广东工业大学837核心考点",stem:"在模拟计算机连续系统模拟结构图（由积分器、加法器、数乘器组成）中，通常规定选择哪个节点作为系统的状态变量：",options:[{key:"A",text:"每个积分器的输出端信号"},{key:"B",text:"每个积分器的输入端信号"},{key:"C",text:"每个加法器的输入端信号"},{key:"D",text:"系统的最终输出端"}],answer:"A",analysis:`【核心考点】：连续系统框图中状态变量的经典选取规范。

1. 积分器的时域关系为：输出 $x_i(t) = \\int_{-\\infty}^t u_i(	au)d	au \\implies \\dot{x}_i(t) = u_i(t)$；
2. 若将**每个积分器的输出端信号**定义为状态变量 $x_i(t)$，则**积分器的输入端信号恰好自动对应其一阶导数 $\\dot{x}_i(t)$**；
3. 这样一来，积分器输入端所汇聚的加法器代数式，直接自然构成了状态微分方程 $\\dot{\\mathbf{x}}(t) = \\mathbf{A}\\mathbf{x}(t) + \\mathbf{b}f(t)$！
4. 这种选取方法简洁、严谨且标准化。
选 **A**。`},{id:"ss-c6-zjl-01",subject:"广工837/809-信号与系统",chapter:"第六章：系统状态变量与信号流图",section:"RLC串联电路状态矩阵建立",type:"single",difficulty:3,tags:["郑君里考研题","状态方程","RLC电路"],source:"郑君里《信号与系统》(第3版)课后习题7.3",stem:"在电阻 $R$、电感 $L$、电容 $C$ 与电压源 $e(t)$ 串联的闭合回路中，选取电容电压 $u_C(t)$ 和电感电流 $i_L(t)$ 构成状态向量 $\\mathbf{x}(t) = [u_C(t), \\, i_L(t)]^T$。则系统的状态转移矩阵 $\\mathbf{A}$ 为：",options:[{key:"A",text:"$\\begin{bmatrix} 0 & \\frac{1}{C} \\\\ -\\frac{1}{L} & -\\frac{R}{L} \\end{bmatrix}$"},{key:"B",text:"$\\begin{bmatrix} 0 & -\\frac{1}{C} \\\\ \\frac{1}{L} & -\\frac{R}{L} \\end{bmatrix}$"},{key:"C",text:"$\\begin{bmatrix} -\\frac{R}{L} & -\\frac{1}{L} \\\\ \\frac{1}{C} & 0 \\end{bmatrix}$"},{key:"D",text:"$\\begin{bmatrix} 0 & 1 \\\\ -\\frac{1}{LC} & -\\frac{R}{L} \\end{bmatrix}$"}],answer:"A",analysis:`【核心考点】：动态电路拓扑建立标准状态方程 $\\dot{\\mathbf{x}} = \\mathbf{A}\\mathbf{x} + \\mathbf{b}e$。

1. **根据电容伏安关系**：
   串联回路中流过电容的电流即为电感电流 $i_L(t)$：
   $$C \\frac{du_C(t)}{dt} = i_L(t) \\implies \\dot{u}_C(t) = 0 \\cdot u_C(t) + \\frac{1}{C} i_L(t)$$
2. **根据回路 KVL 定律**：
   沿回路绕行：$L \\frac{di_L(t)}{dt} + R i_L(t) + u_C(t) = e(t)$；
   整理出电感电流导数：
   $$\\dot{i}_L(t) = -\\frac{1}{L} u_C(t) - \\frac{R}{L} i_L(t) + \\frac{1}{L} e(t)$$
3. **写成矩阵形式**：
   $$\\begin{bmatrix} \\dot{u}_C \\\\ \\dot{i}_L \\end{bmatrix} = \\begin{bmatrix} 0 & \\frac{1}{C} \\\\ -\\frac{1}{L} & -\\frac{R}{L} \\end{bmatrix} \\begin{bmatrix} u_C \\\\ i_L \\end{bmatrix} + \\begin{bmatrix} 0 \\\\ \\frac{1}{L} \\end{bmatrix} e(t)$$
故状态矩阵 $\\mathbf{A} = \\begin{bmatrix} 0 & \\frac{1}{C} \\\\ -\\frac{1}{L} & -\\frac{R}{L} \\end{bmatrix}$。选 **A**。`},{id:"ss-c6-zjl-02",subject:"广工837/809-信号与系统",chapter:"第六章：系统状态变量与信号流图",section:"互不接触双回路梅森增益公式",type:"single",difficulty:3,tags:["郑君里考研题","梅森公式","不接触回路"],source:"郑君里《信号与系统》(第3版)课后习题7.8",stem:"某控制系统信号流图仅有单条前向通路 $P_1 = G_1 G_2 G_3$，且系统中仅包含两个互不接触的局部负反馈回路，回路增益分别为 $L_1 = -H_1$ 和 $L_2 = -H_2$。若两回路均与前向通路相接触，则系统的闭环传输函数 $H(s)$ 为：",options:[{key:"A",text:"$\\frac{G_1 G_2 G_3}{(1 + H_1)(1 + H_2)}$"},{key:"B",text:"$\\frac{G_1 G_2 G_3}{1 + H_1 + H_2}$"},{key:"C",text:"$\\frac{G_1 G_2 G_3}{1 - H_1 - H_2 + H_1 H_2}$"},{key:"D",text:"$\\frac{G_1 G_2 G_3}{1 + H_1 H_2}$"}],answer:"A",analysis:`【核心考点】：含互不接触回路时梅森公式行列式 $\\Delta$ 的精确展开。

1. **计算特征行列式 $\\Delta$**：
   $$\\Delta = 1 - \\sum L_i + \\sum L_i L_j$$
   代入两回路增益：
   - 所有单独回路之和：$\\sum L_i = L_1 + L_2 = -H_1 - H_2$；
   - 两两互不接触回路乘积：$L_1 L_2 = (-H_1)(-H_2) = H_1 H_2$；
   因此：
   $$\\Delta = 1 - (-H_1 - H_2) + H_1 H_2 = 1 + H_1 + H_2 + H_1 H_2 = (1 + H_1)(1 + H_2)$$
2. **计算余子式 $\\Delta_1$**：
   因为 $L_1$ 与 $L_2$ 均与前向通路 $P_1$ 相接触，当抹去前向通路后没有任何孤立回路剩余，故 $\\Delta_1 = 1$；
3. **套用梅森增益公式**：
   $$H(s) = \\frac{P_1 \\Delta_1}{\\Delta} = \\frac{G_1 G_2 G_3}{(1 + H_1)(1 + H_2)}$$
选 **A**。`},{id:"ss-c7-01",subject:"广工837/809-信号与系统",chapter:"第七章：时域抽样与恢复",section:"信号平方频带扩展抽样率",type:"single",difficulty:3,tags:["2023年837真题","抽样定理","频带展宽"],source:"广东工业大学2023年837全国统考真题第6题",stem:"已知带限信号 $f(t)$ 的最高截止角频率为 $\\omega_m$。若构造信号 $y(t) = f^2(t)$，则对信号 $y(t)$ 进行无失真恢复所需的最小奈奎斯特抽样角频率 $\\omega_s$ 为：",options:[{key:"A",text:"$4\\omega_m$"},{key:"B",text:"$2\\omega_m$"},{key:"C",text:"$\\omega_m$"},{key:"D",text:"$8\\omega_m$"}],answer:"A",analysis:`【核心考点】：时域相乘对应频域卷积后的频带展宽规律。

1. 时域信号自身相乘：$y(t) = f(t) \\cdot f(t)$；
2. 由频域卷积定理：
   $$Y(j\\omega) = \frac{1}{2\\pi} [F(j\\omega) * F(j\\omega)]$$
3. 频带展宽法则：
   原信号频谱 $F(j\\omega)$ 限带于 $[-\\omega_m, \\omega_m]$；
   两个区间长度为 $2\\omega_m$ 的频谱做卷积，非零区域变为 $[-\\omega_m - \\omega_m, \\omega_m + \\omega_m] = [-2\\omega_m, 2\\omega_m]$；
   因此 $y(t)$ 的最高截止角频率扩大为 $\\omega_{m, y} = 2\\omega_m$；
4. 由奈奎斯特抽样定理，最小抽样频率为最高频率的 2 倍：
   $$\\omega_s \\ge 2 \\omega_{m, y} = 2(2\\omega_m) = 4\\omega_m$$
故选 **A**。`},{id:"ss-c7-02",subject:"广工837/809-信号与系统",chapter:"第七章：时域抽样与恢复",section:"双频相乘信号采样率",type:"single",difficulty:2,tags:["2022年837真题","抽样频率","频带叠加"],source:"广东工业大学2022年837全国统考真题第8题",stem:"已知连续信号 $f_1(t)$ 的最高频率为 $100	ext{ Hz}$，$f_2(t)$ 的最高频率为 $200	ext{ Hz}$。若将两信号相乘构成新信号 $y(t) = f_1(t)f_2(t)$，则对 $y(t)$ 进行理想抽样时的奈奎斯特频率为：",options:[{key:"A",text:"$600	ext{ Hz}$"},{key:"B",text:"$400	ext{ Hz}$"},{key:"C",text:"$300	ext{ Hz}$"},{key:"D",text:"$200	ext{ Hz}$"}],answer:"A",analysis:`【核心考点】：两不同带限信号时域相乘后的奈奎斯特抽样速率计算。

1. 时域相乘对应频域卷积：$Y(\\omega) = \frac{1}{2\\pi}[F_1(\\omega) * F_2(\\omega)]$；
2. 卷积后新信号的最高上限频率等于两信号上限频率之和：
   $$f_{m, y} = f_{m1} + f_{m2} = 100	ext{ Hz} + 200	ext{ Hz} = 300	ext{ Hz}$$
3. 根据低通奈奎斯特抽样定理：
   $$f_s \\ge 2 f_{m, y} = 2 	imes 300	ext{ Hz} = 600	ext{ Hz}$$
故该信号的奈奎斯特频率为 **600 Hz**。选 **A**。`},{id:"ss-c7-03",subject:"广工837/809-信号与系统",chapter:"第七章：时域抽样与恢复",section:"理想低通滤波信号重构",type:"single",difficulty:3,tags:["抽样定理","信号恢复","内插公式"],source:"广东工业大学837/809核心考点",stem:"以采样间隔 $T_s$ 对带限信号 $f(t)$（最高截止频率 $\\omega_m$ 满足 $\\omega_s = \frac{2\\pi}{T_s} \\ge 2\\omega_m$）进行理想冲激抽样后，通过截止频率为 $\frac{\\omega_s}{2}$、增益为 $T_s$ 的理想低通滤波器恢复原信号的内插重构公式（Whittaker-Shannon 抽样公式）为：",options:[{key:"A",text:"$f(t) = \\sum_{n=-\\infty}^\\infty f(n T_s) 	ext{Sa}\\left(\frac{\\omega_s}{2}(t - n T_s)\right)$"},{key:"B",text:"$f(t) = \\sum_{n=-\\infty}^\\infty f(n T_s) \\delta(t - n T_s)$"},{key:"C",text:"$f(t) = \\sum_{n=-\\infty}^\\infty f(n T_s) \\cos(\\omega_s t)$"},{key:"D",text:"$f(t) = \frac{1}{T_s} \\sum_{n=-\\infty}^\\infty f(n T_s) 	ext{rect}(t - n T_s)$"}],answer:"A",analysis:`【核心考点】：时域抽样定理的 Whittaker-Shannon 信号重构内插公式。

1. 冲激抽样信号为：
   $$f_s(t) = \\sum_{n=-\\infty}^\\infty f(n T_s) \\delta(t - n T_s)$$
2. 理想低通滤波器的冲激响应为抽样函数：
   $$h(t) = 	ext{Sa}\\left(\frac{\\omega_s}{2} t\right)$$
3. 抽样信号通过低通滤波器时，时域响应等于两者做卷积：
   $$f(t) = f_s(t) * h(t) = \\left[ \\sum_{n=-\\infty}^\\infty f(n T_s) \\delta(t - n T_s) \right] * 	ext{Sa}\\left(\frac{\\omega_s}{2} t\right)$$
4. 利用冲激卷积的平移性质得到：
   $$f(t) = \\sum_{n=-\\infty}^\\infty f(n T_s) 	ext{Sa}\\left(\frac{\\omega_s}{2}(t - n T_s)\right)$$
选 **A**。`},{id:"ss-c7-04",subject:"广工837/809-信号与系统",chapter:"第七章：时域抽样与恢复",section:"尺度与时移抽样频率",type:"single",difficulty:2,tags:["2025年809真题","尺度变换","抽样频率"],source:"广东工业大学2025年809全国统考真题第7题",stem:"若对带限连续信号 $f(t)$ 进行理想采样，其奈奎斯特频率为 $f_s	ext{ Hz}$。则时移与尺度变换信号 $f\\left(\frac{1}{3}t - 2\right)$ 的奈奎斯特采样频率为：",options:[{key:"A",text:"$\frac{1}{3}f_s	ext{ Hz}$"},{key:"B",text:"$3f_s	ext{ Hz}$"},{key:"C",text:"$f_s	ext{ Hz}$"},{key:"D",text:"$\frac{1}{9}f_s	ext{ Hz}$"}],answer:"A",analysis:`【核心考点】：傅里叶变换时移与尺度变换对最高带宽的影响。

1. 设原信号 $f(t)$ 的最高截止频率为 $f_m$，其奈奎斯特采样频率为 $f_s = 2f_m$；
2. 对信号进行自变量变换 $g(t) = f(\frac{1}{3}t - 2)$：
   - 时移 $-2$ 产生频域线性相位偏移 $e^{-j 2\\omega}$，完全不改变频带幅度范围；
   - 尺度变换因子为 $a = \frac{1}{3} < 1$，时域信号被展宽为原来的 3 倍；
3. 由尺度性质 $f(at) \\leftrightarrow \frac{1}{|a|}F(\frac{\\omega}{a})$：

1. **时域机理**：平顶抽样信号可视为理想冲激抽样信号 $f_s(t)$ 与宽度为 $\\tau$ 的单矩形脉冲 $p(t) = \\text{rect}(t/\\tau)$ 的时域卷积：
   $$f_{pam}(t) = f_s(t) * p(t)$$
2. **频域机理**：频域表现为相乘：
   $$F_{pam}(j\\omega) = F_s(j\\omega) \\cdot P(j\\omega) = F_s(j\\omega) \\cdot \\tau\\text{Sa}\\left(\\frac{\\omega\\tau}{2}\\right)$$
3. **孔径失真分析**：
   矩形脉冲频谱是一个采样函数 $\\text{Sa}(\\frac{\\omega\\tau}{2})$，随着频率 $\\omega$ 增大，增益不断下降，导致抽样信号的高频分量被衰减，产生失真；
4. **均衡补偿方案**：

   $$H_{eq}(j\\omega) = \\frac{1}{\\text{Sa}\\left(\\frac{\\omega\\tau}{2}\\right)}$$
   两者相乘即可精确对消孔径衰减，完全复原基带频谱。

$$\\frac{2\\pi}{\\Omega_0} = \\frac{2\\pi}{\\frac{3\\pi}{7}} = \\frac{14}{3}$$
$\\frac{14}{3}$ 是有理数，且分子分母互质。为了使周期 $N$ 为正整数，最小正周期为既约分数的分子：

【小马哥点拨】：离散与连续最大的区别：离散信号的周期 $N$ 必须是正整数！计算出 $\\frac{2\\pi}{\\Omega_0} = \\frac{M}{K}$（互质分数）后，$N = M$，千万不要误选分数 $14/3$！`},{id:"960-c1-03",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"离散复指数周期",type:"single",difficulty:3,tags:["小马哥960","2022西安邮电大学","复指数序列","欧拉公式"],source:"小马哥《信号与系统960题》第1章",stem:"离散时间复指数信号 $f[k] = e^{j\\left(\\frac{2\\pi}{6}k - \\frac{\\pi}{3}\\right)}$ 的基波周期 $N$ 是（ ）。",options:[{key:"A",text:"$3$"},{key:"B",text:"$6$"},{key:"C",text:"$6\\pi$"},{key:"D",text:"非周期信号"}],answer:"B",analysis:`复指数信号的周期求解与三角序列完全相同：
$$f[k] = e^{j(\\Omega_0 k + \\varphi)}$$
其数字角频率 $\\Omega_0 = \\frac{2\\pi}{6} = \\frac{\\pi}{3}$。
则：

因为 6 已是既约整数，故基波周期 $N = 6$。选 B。

【小马哥点拨】：由欧拉公式 $e^{j\\alpha} = \\cos\\alpha + j\\sin\\alpha$，复指数信号的周期由实部余弦和虚部正弦的公共周期决定，其数字角频率就是指数项中 $k$ 的系数。`},{id:"960-c1-04",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"多信号叠加周期",type:"single",difficulty:3,tags:["小马哥960","2023电子科技大学","多频合成","最小公倍数"],source:"小马哥《信号与系统960题》第1章",stem:"离散时间信号 $x[n] = 2e^{j\\left(\\frac{\\pi}{4}n + 2\\right)} + \\cos\\left(\\frac{\\pi}{6}n\\right)$ 的基波周期为（ ）。",options:[{key:"A",text:"$12$"},{key:"B",text:"$8$"},{key:"C",text:"$24$"},{key:"D",text:"不存在（非周期）"}],answer:"C",analysis:`对两分量信号分别求周期：
1) 第一分量 $x_1[n] = 2e^{j(\\frac{\\pi}{4}n + 2)}$，数字角频率 $\\Omega_1 = \\frac{\\pi}{4}$：

【小马哥点拨】：两个离散周期信号相加，只要各自有周期 $N_1, N_2$（正整数），它们相加必定仍是周期的，总周期必然是 $\\text{lcm}(N_1, N_2)$！`},{id:"960-c1-05",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"冲激函数抽样性质",type:"single",difficulty:2,tags:["小马哥960","2023湖北工业大学","狄拉克冲激","抽样性质"],source:"小马哥《信号与系统960题》第1章",stem:"定积分 $\\int_{-\\infty}^{\\infty} (t^3 + t^2 + 1)[\\delta(t) + \\delta(t-2)]\\,dt$ 的计算结果为（ ）。",options:[{key:"A",text:"$1$"},{key:"B",text:"$13$"},{key:"C",text:"$14$"},{key:"D",text:"$15$"}],answer:"C",analysis:`根据冲激函数的筛选性质 $\\int_{-\\infty}^\\infty f(t)\\delta(t-t_0)\\,dt = f(t_0)$：
设 $f(t) = t^3 + t^2 + 1$，展开积分：

【小马哥点拨】：冲激函数的筛选积分本质上就是“把冲激点 $t_0$ 直接代入相乘的连续函数”。两项相加即分别求值相加。`},{id:"960-c1-06",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"冲激偶函数性质",type:"single",difficulty:3,tags:["小马哥960","2023山东师范大学","冲激偶","导数抽样"],source:"小马哥《信号与系统960题》第1章",stem:"计算积分 $\\int_{-\\infty}^{\\infty} \\frac{\\sin(3\\pi t)}{\\pi t} \\delta'(t)\\,dt$ 的结果为（ ）。",options:[{key:"A",text:"$3$"},{key:"B",text:"$-3$"},{key:"C",text:"$0$"},{key:"D",text:"不存在"}],answer:"C",analysis:`由一阶冲激偶 $\\delta'(t)$ 的广义函数积分性质：
$$\\int_{-\\infty}^{\\infty} f(t)\\delta'(t)\\,dt = -f'(0)$$
令 $f(t) = \\frac{\\sin(3\\pi t)}{\\pi t}$。
注意 $f(t)$ 是偶函数，因为 $\\sin(-x) = -\\sin(x)$ 且分母 $-t = -t$，负负得正，所以 $f(-t) = f(t)$。
任何可导偶函数在其对称中心 $t=0$ 处的导数必然为零，即 $f'(0) = 0$。
亦可对 $f(t)$ 做泰勒级数展开验证：
$$f(t) = \\frac{1}{\\pi t}\\left[3\\pi t - \\frac{(3\\pi t)^3}{6} + \\cdots\\right] = 3 - \\frac{9\\pi^2}{2}t^2 + O(t^4)$$
对 $t$ 求导得 $f'(t) = -9\\pi^2 t + \\cdots$，在 $t=0$ 时 $f'(0) = 0$。

【小马哥点拨】：做冲激偶 $\\delta'(t)$ 积分时，注意公式带负号 $-f'(0)$；若发现待积函数是偶函数，在 $0$ 处的导数必为 0，直接秒杀！`},{id:"960-c1-07",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"信号时域变换",type:"single",difficulty:3,tags:["小马哥960","2023广西民族大学","尺度反转时移","支撑集"],source:"小马哥《信号与系统960题》第1章",stem:"已知连续时间信号 $f(t) = 0 \\ (t < 3)$，则变换信号 $g(t) = f(2 - 3t)$ 一定为零（$g(t) = 0$）的 $t$ 取值范围是（ ）。",options:[{key:"A",text:"$t > -1/3$"},{key:"B",text:"$t < -1/3$"},{key:"C",text:"$t > 3$"},{key:"D",text:"$t < 0$"}],answer:"A",analysis:`已知当括号内的自变量小于 3 时信号恒为 0，即：

对于 $g(t) = f(2 - 3t)$，令复合自变量 $\\tau = 2 - 3t < 3$：

因此当 $t > -1/3$ 时，必有 $g(t) = 0$。选 A。

【小马哥点拨】：求解信号时移尺度变换后的非零或为零区间，直接将括号内的复合表达式代入原信号的不等式条件中，解一元一次不等式即可，注意不等式两边同除以负数时要变号！`},{id:"960-c1-08",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"离散序列抽样与插值",type:"single",difficulty:3,tags:["小马哥960","离散尺度变换","下采样","插值"],source:"小马哥《信号与系统960题》第1章",stem:"已知离散时间信号 $x[n]$，定义 $y_1[n] = x[2n]$，$y_2[n] = \\begin{cases} x[n/2], & n\\text{为偶数} \\\\ 0, & n\\text{为奇数} \\end{cases}$，下列关于 $y_1[n]$ 与 $y_2[n]$ 的叙述正确的是（ ）。",options:[{key:"A",text:"$y_1[n]$ 表示下采样抽取，$y_2[n]$ 表示插零上采样扩展"},{key:"B",text:"$y_1[n]$ 表示插值扩展，$y_2[n]$ 表示下采样抽取"},{key:"C",text:"$y_1[n]$ 与 $y_2[n]$ 的频域频谱完全相同"},{key:"D",text:"$y_1[n]$ 的变换不会丢失原信号 $x[n]$ 的任何信息"}],answer:"A",analysis:`1) $y_1[n] = x[2n]$ 仅保留了 $x[n]$ 的偶数索引样点（$n = 0, \\pm 2, \\pm 4, \\dots$），丢弃了所有的奇数样点，这在数字信号处理中称为“抽取”（Down-sampling/Decimation），在时域体现为序列压缩，由于丢失了样点信息可能产生频谱混叠；
2) $y_2[n]$ 在原序列两个样点之间插入了 0，时间轴被扩展为原来的 2 倍，称为“内插/插零”（Up-sampling/Interpolation）。
故 A 叙述正确。

【小马哥点拨】：离散自变量 $n$ 必须是整数，因此 $x[2n]$ 是隔点丢弃抽取，而非平滑压缩；$x[n/2]$ 对奇数点无定义，必须定义为插零。`},{id:"960-c1-09",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"能量信号与功率信号",type:"single",difficulty:3,tags:["小马哥960","能量积分","伽马函数","信号分类"],source:"小马哥《信号与系统960题》第1章",stem:"信号 $f(t) = t e^{-2t} u(t)$ 的类型及总能量 $E$ 分别为（ ）。",options:[{key:"A",text:"功率信号，$P = 1/4$"},{key:"B",text:"能量信号，$E = 1/32$"},{key:"C",text:"能量信号，$E = 1/16$"},{key:"D",text:"既非能量又非功率信号"}],answer:"B",analysis:`根据连续信号的总能量定义：
$$E = \\int_{-\\infty}^{\\infty} |f(t)|^2\\,dt = \\int_0^\\infty t^2 e^{-4t}\\,dt$$
应用定积分常用积分公式：
$$\\int_0^\\infty t^n e^{-at}\\,dt = \\frac{n!}{a^{n+1}} \\quad (a > 0)$$
在此积分中 $n = 2, a = 4$：
$$E = \\frac{2!}{4^{2+1}} = \\frac{2}{4^3} = \\frac{2}{64} = \\frac{1}{32}\\text{ J}$$
由于总能量 $0 < E < \\infty$ 为非零有限值，其平均功率 $P = \\lim_{T\\to\\infty} \\frac{E}{T} = 0$，故该信号为典型的能量信号。选 B。

【小马哥点拨】：只要信号含有单边实指数衰减因子 $e^{-at}u(t) \\ (a>0)$，其衰减速度远超任意多项式 $t^n$ 的增长，必然收敛，绝对是能量信号！公式 $\\int_0^\\infty t^n e^{-at}dt = \\frac{n!}{a^{n+1}}$ 必须背得滚瓜烂熟。`},{id:"960-c1-10",subject:"广工837/809-信号与系统",chapter:"第一章：信号与系统基础",section:"系统性质综合判定",type:"single",difficulty:3,tags:["小马哥960","系统性质","时变","因果稳定性"],source:"小马哥《信号与系统960题》第1章",stem:"某系统的输入输出关系为 $y(t) = x(2t) + \\cos(\\omega_0 t)$，该系统属于（ ）。",options:[{key:"A",text:"线性、时不变、因果、稳定"},{key:"B",text:"非线性、时变、非因果、稳定"},{key:"C",text:"线性、时变、因果、稳定"},{key:"D",text:"非线性、时不变、非因果、不稳定"}],answer:"B",analysis:`逐项分析系统四大核心性质：
1) **线性**：当输入 $x(t) = 0$ 时，输出 $y(t) = \\cos(\\omega_0 t) \\ne 0$，零输入时不满足零输出（存在零输入非零响应），且不满足齐次性与可加性，故为**非线性系统**；
2) **时变性**：延迟输入 $x_1(t) = x(t-t_0)$ 产生的响应为 $y_1(t) = x(2t - t_0) + \\cos(\\omega_0 t)$；而原输出的延迟版本为 $y(t-t_0) = x(2(t-t_0)) + \\cos(\\omega_0(t-t_0))$，两者不相等，故为**时变系统**；
3) **因果性**：当 $t = 1$ 时，输出 $y(1) = x(2) + \\cos(\\omega_0)$，依赖于未来时刻 $t=2$ 的输入，故为**非因果系统**；
4) **BIBO稳定性**：若输入有界 $|x(t)| \\le M_x < \\infty$，则输出 $|y(t)| \\le M_x + 1 < \\infty$ 必有界，故为**稳定系统**。
综合判定选 B。

【小马哥点拨】：系统判定秒杀诀窍：
① 凡是表达式中加了常数或外加独立时间函数的（如 $+\\cos(\\omega_0 t)$），一律非线性；
② 凡是自变量 $t$ 前带系数不为 1 的（如 $x(2t)$）或乘了显式时间 $t$ 的，一律时变；
③ $x(2t)$ 在 $t>0$ 时预取未来值，一律非因果。`},{id:"960-c2-01",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"卷积积分基本性质",type:"single",difficulty:2,tags:["小马哥960","2022中国科学院大学","冲激移位","卷积性质"],source:"小马哥《信号与系统960题》第2章",stem:"信号 $f(t - t_0)$ 与单位冲激函数 $\\delta(t)$ 进行卷积积分的结果是（ ）。",options:[{key:"A",text:"$f(t - t_0)$"},{key:"B",text:"$f(-t)$"},{key:"C",text:"$f(t)$"},{key:"D",text:"$f(t + t_0)$"}],answer:"A",analysis:`根据单位冲激函数 $\\delta(t)$ 在卷积中的单位元性质：
对于任意信号 $x(t)$，均有：
$$x(t) * \\delta(t) = x(t)$$
将 $x(t) = f(t - t_0)$ 视为一个整体信号，则：
$$f(t - t_0) * \\delta(t) = f(t - t_0)$$
故选 A。

【小马哥点拨】：$\\delta(t)$ 在卷积运算中等价于算术乘法中的常数 1。与 $\\delta(t)$ 卷积信号波形与时移保持原样不变；与 $\\delta(t-t_1)$ 卷积则产生对应的时移 $f(t - t_0 - t_1)$。`},{id:"960-c2-02",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"单位冲激响应逆求",type:"single",difficulty:2,tags:["小马哥960","2023广州大学","冲激响应","逆向求解"],source:"小马哥《信号与系统960题》第2章",stem:"某 LTI 系统输入为 $f(t)$，测得零状态输出为 $y(t) = 2f(t - t_0)$，则该系统的单位冲激响应 $h(t)$ 为（ ）。",options:[{key:"A",text:"$2\\delta(t)$"},{key:"B",text:"$2\\delta(t - t_0)$"},{key:"C",text:"$\\delta(t - 2t_0)$"},{key:"D",text:"$2u(t - t_0)$"}],answer:"B",analysis:`根据 LTI 系统的输入输出时域卷积关系：
$$y(t) = f(t) * h(t)$$
已知输出表达式为 $y(t) = 2f(t - t_0)$。
又由冲激卷积的时移性质可知：
$$f(t) * [2\\delta(t - t_0)] = 2[f(t) * \\delta(t - t_0)] = 2f(t - t_0)$$
两者对比可得系统单位冲激响应为：
$$h(t) = 2\\delta(t - t_0)$$
故选 B。

【小马哥点拨】：单位冲激响应 $h(t)$ 的定义即输入为单位冲激激励 $f(t) = \\delta(t)$ 时系统产生的零状态响应。直接令 $f(t) = \\delta(t)$ 代入 $y(t) = 2f(t-t_0)$，即刻得到 $h(t) = 2\\delta(t-t_0)$！`},{id:"960-c2-03",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"门函数卷积几何规律",type:"single",difficulty:3,tags:["小马哥960","矩形卷积","三角形梯形","考研秒杀"],source:"小马哥《信号与系统960题》第2章",stem:"设门函数 $f_1(t) = G_2(t)$（宽度为 2，高度为 1）与 $f_2(t) = G_4(t)$（宽度为 4，高度为 2）进行时域卷积 $y(t) = f_1(t) * f_2(t)$，则所得波形及特征为（ ）。",options:[{key:"A",text:"等腰三角形，底宽为 6，峰值为 4"},{key:"B",text:"等腰梯形，上底宽为 2，下底宽为 6，最大高度为 4"},{key:"C",text:"等腰梯形，上底宽为 4，下底宽为 8，最大高度为 2"},{key:"D",text:"矩形，宽度为 6，高度为 2"}],answer:"B",analysis:`应用小马哥矩形脉冲卷积几何秒杀规律：
1) **形状判定**：两个不等宽度的矩形脉冲进行卷积，结果必然是**对称等腰梯形**；
2) **下底宽度**：等于两矩形宽度之和，即 $T_{\\text{下底}} = W_1 + W_2 = 2 + 4 = 6$；
3) **上底宽度**：等于两矩形宽度之差的绝对值，即 $T_{\\text{上底}} = |W_2 - W_1| = |4 - 2| = 2$；
4) **最大峰值高度**：等于两矩形高度与较窄矩形宽度的三者乘积，即 $H_{\\max} = H_1 \\times H_2 \\times \\min(W_1, W_2) = 1 \\times 2 \\times 2 = 4$。
因此结果为上底宽 2、下底宽 6、最大高度为 4 的等腰梯形。选 B。

【小马哥点拨】：矩形卷积两大铁律：
① 相同宽度门信号卷积 $\\to$ 等腰三角形（底为 $2W$，高为 $H_1 H_2 W$）；
② 不同宽度门信号卷积 $\\to$ 等腰梯形（下底为 $W_1+W_2$，上底为 $|W_1-W_2|$，高为 $H_1 H_2 \\min(W_1,W_2)$）。考研无需积分，直接画图秒杀！`},{id:"960-c2-04",subject:"广工837/809-信号与系统",chapter:"第二章：系统的时域分析",section:"冲激匹配法初值跳变",type:"single",difficulty:4,tags:["小马哥960","2023考研真题","冲激匹配法","状态跳变"],source:"小马哥《信号与系统960题》第2章",stem:"某连续系统微分方程为 $y''(t) + 3y'(t) + 2y(t) = 2\\delta'(t) + \\delta(t)$，已知 $t < 0$ 时系统处于静止状态（$y(0^-) = 0, y'(0^-) = 0$），则在 $t = 0^+$ 时刻响应及其导数的跳变量为（ ）。",options:[{key:"A",text:"$y(0^+) = 2, \\ y'(0^+) = -5$"},{key:"B",text:"$y(0^+) = 0, \\ y'(0^+) = 2$"},{key:"C",text:"$y(0^+) = 2, \\ y'(0^+) = 1$"},{key:"D",text:"$y(0^+) = 0, \\ y'(0^+) = 0$"}],answer:"A",analysis:`应用冲激响应匹配法：
右端最高阶奇异函数为 $\\delta'(t)$，微分方程左端最高阶导数为 $y''(t)$，根据奇异函数阶次平衡原则，在 $t=0$ 附近设：
$$y''(t) = a\\delta'(t) + b\\delta(t) + \\cdots$$
积分一次可得：
$$y'(t) = a\\delta(t) + bu(t) + \\cdots$$
再积分一次可得：
$$y(t) = au(t) + btu(t) + \\cdots$$
将 $y, y', y''$ 代入原微分方程，对比两端奇异函数的系数：
$$[a\\delta'(t) + b\\delta(t)] + 3[a\\delta(t)] = 2\\delta'(t) + \\delta(t)$$
比较 $\\delta'(t)$ 项系数：$a = 2$

【小马哥点拨】：几何矢量法秒杀滤波器类型：分子无 $s$（只有常数）而分母有极点的，必为低通；分子有原点零点 $s^k$ 次数与分母相同的，必为高通；分子零点在虚轴特定频率的，为带阻。`},{id:"960-c4-07",subject:"广工837/809-信号与系统",chapter:"第四章：拉普拉斯变换与复频域分析",section:"梅森增益公式求解传输函数",type:"single",difficulty:3,tags:["小马哥960","梅森公式","信号流图","回路增益"],source:"小马哥《信号与系统960题》第4章",stem:"某单输入单输出反馈系统的信号流图中，前向通路增益为 $P_1 = k s^{-1}$，系统中仅存在一个单反馈环路，其回路增益为 $L_1 = -k s^{-1}$，且前向通路与该环路相接触（$\\Delta_1 = 1$），则该系统的闭环传递函数 $H(s)$ 为（ ）。",options:[{key:"A",text:"$H(s) = \\frac{k}{s + k}$"},{key:"B",text:"$H(s) = \\frac{k}{s - k}$"},{key:"C",text:"$H(s) = \\frac{s}{s + k}$"},{key:"D",text:"$H(s) = \\frac{1}{s + k}$"}],answer:"A",analysis:`应用梅森增益公式（Mason's Gain Formula）：

【小马哥点拨】：当 $a=1$ 时差分方程为 $y[n] - y[n-1] = x[n]$，即累加器（离散积分器）。阶跃信号有无穷多个值为 1 的样本，每经过一个时刻累加一次，在 $n=0$ 时为 1，在 $n=1$ 时为 2，故 $s[n] = (n+1)u[n]$。`},{id:"960-c5-06",subject:"广工837/809-信号与系统",chapter:"第五章：Z变换与离散系统",section:"离散系统因果稳定性判定",type:"single",difficulty:2,tags:["小马哥960","离散因果稳定","单位圆","极点判定"],source:"小马哥《信号与系统960题》第7章",stem:"因果离散时间 LTI 系统 BIBO 稳定的充要条件是其系统函数 $H(z)$ 的（ ）。",options:[{key:"A",text:"所有极点严格位于 $z$ 平面单位圆内部（$|z_k| < 1$）"},{key:"B",text:"所有极点位于单位圆上或单位圆内"},{key:"C",text:"所有极点严格位于左半平面"},{key:"D",text:"零点严格位于单位圆内"}],answer:"A",analysis:`1) **稳定性充要条件**：离散 LTI 系统稳定的充要条件是收敛域 ROC 包含单位圆 $|z| = 1$（保证 DTFT 存在且绝对可和 $\\sum |h[n]| < \\infty$）；

第 1 步：商 $1$，余数 $(1 + 2z^{-1}) - (1 - 0.5z^{-1}) = 2.5z^{-1}$；
第 2 步：商 $2.5z^{-1}$，余数 $2.5z^{-1} - (2.5z^{-1} - 1.25z^{-2}) = 1.25z^{-2}$；

因此：
$$F(z) = 1 + 2.5z^{-1} + 1.25z^{-2} + \\cdots$$
对应系数即为样值：$f[0] = 1, f[1] = 2.5, f[2] = 1.25$。

【小马哥点拨】：求序列前几项，长除法（降幂排列除法）最快最不易出错！注意因果序列按 $z^{-1}$ 升幂（即 $z$ 的降幂）排列做除法。`},{id:"960-c5-08",subject:"广工837/809-信号与系统",chapter:"第五章：Z变换与离散系统",section:"离散正弦稳态响应",type:"single",difficulty:3,tags:["小马哥960","特征输入法","正弦稳态","频率响应"],source:"小马哥《信号与系统960题》第8章",stem:"某稳定离散 LTI 系统的频率响应为 $H(e^{j\\Omega}) = \\frac{1}{1 - 0.5e^{-j\\Omega}}$，当输入激励为 $x[n] = \\cos(\\pi n) = (-1)^n$ 时，系统的稳态输出 $y_{ss}[n]$ 为（ ）。",options:[{key:"A",text:"$\\frac{2}{3}\\cos(\\pi n)$"},{key:"B",text:"$2\\cos(\\pi n)$"},{key:"C",text:"$\\frac{1}{1.5}$"},{key:"D",text:"$\\cos(\\pi n + \\pi/2)$"}],answer:"A",analysis:`应用特征输入法（正弦稳态响应）：
输入激励的数字角频率为 $\\Omega = \\pi$。
将 $\\Omega = \\pi$ 代入系统的频率响应表达式：
$$H(e^{j\\pi}) = \\frac{1}{1 - 0.5e^{-j\\pi}}$$

写成标准矩阵状态方程 $\\dot{x}(t) = A x(t) + B f(t)$：
$$\\begin{bmatrix} \\dot{x}_1(t) \\\\ \\dot{x}_2(t) \\end{bmatrix} = \\begin{bmatrix} 0 & 1 \\\\ -2 & -3 \\end{bmatrix} \\begin{bmatrix} x_1(t) \\\\ x_2(t) \\end{bmatrix} + \\begin{bmatrix} 0 \\\\ 1 \\end{bmatrix} f(t)$$

极点为 $s = -1, -2$（均在左半平面，系统因果稳定）。故选 A。`},{id:"ss-c4-32",subject:"广工837/809-信号与系统",chapter:"第四章：拉普拉斯变换与复频域分析",section:"特征输入法与正弦稳态响应",type:"single",difficulty:4,tags:["2023年大题必考","特征输入法","正弦稳态响应","频响函数H(jw)"],source:"广东工业大学2023年837真题第4题",stem:"某稳定连续因果LTI系统的系统函数为 $H(s) = \\frac{s + 2}{s^2 + 2s + 2}$。当系统输入激励为正弦信号 $f(t) = 10\\cos(2t)u(t)$ 时，其正弦稳态响应分量 $y_{ss}(t)$ 为（ ）。",options:[{key:"A",text:"$y_{ss}(t) = \\sqrt{10}\\cos(2t - 18.43^\\circ)$"},{key:"B",text:"$y_{ss}(t) = \\sqrt{10}\\cos(2t + 71.57^\\circ)$"},{key:"C",text:"$y_{ss}(t) = 5\\sqrt{2}\\cos(2t - 45^\\circ)$"},{key:"D",text:"$y_{ss}(t) = 10\\cos(2t + 45^\\circ)$"}],answer:"B",analysis:`【核心考点】：特征输入法（Eigen-function Method）求解正弦稳态响应（2023年大题考察重点）。

1. 单边 $z$ 变换时延公式：
$$\\mathcal{Z}\\{y[k-1]\\} = z^{-1} Y(z) + y[-1]$$
$$\\mathcal{Z}\\{y[k-2]\\} = z^{-2} Y(z) + z^{-1} y[-1] + y[-2]$$
2. 对差分方程取单边 $z$ 变换：
$$Y(z) - 0.7[z^{-1}Y(z) + y[-1]] + 0.1[z^{-2}Y(z) + z^{-1}y[-1] + y[-2]] = F(z)$$
$$(1 - 0.7z^{-1} + 0.1z^{-2})Y(z) - [0.7y[-1] - 0.1z^{-1}y[-1] - 0.1y[-2]] = F(z)$$
3. 零输入响应（令 $F(z) = 0$）：
$$(1 - 0.7z^{-1} + 0.1z^{-2})Y_{zi}(z) = 0.7(1) - 0.1z^{-1}(1) - 0.1(2) = 0.5 - 0.1z^{-1}$$

对于三阶多项式 $A(z) = a_3 z^3 + a_2 z^2 + a_1 z + a_0 = z^3 - 1.2z^2 + 0.47z - 0.05$：
其中 $a_3 = 1, a_2 = -1.2, a_1 = 0.47, a_0 = -0.05$。
1. **条件一：$|a_0| < a_3$**：
$$|-0.05| = 0.05 < 1 \\quad (\\text{满足！})$$
2. **条件二：$A(1) > 0$**：
$$A(1) = 1^3 - 1.2(1)^2 + 0.47(1) - 0.05 = 1 - 1.2 + 0.47 - 0.05 = 0.22 > 0 \\quad (\\text{满足！})$$
3. **条件三：$(-1)^n A(-1) > 0$（$n=3$ 为奇数，故 $-A(-1) > 0$ 或 $A(-1) < 0$）**：
$$A(-1) = (-1)^3 - 1.2(-1)^2 + 0.47(-1) - 0.05 = -1 - 1.2 - 0.47 - 0.05 = -2.72 < 0$$
$$(-1)^3 A(-1) = -1 \\times (-2.72) = 2.72 > 0 \\quad (\\text{满足！})$$
4. **条件四：构造朱利表二阶行系数**：
$$b_0 = \\det \\begin{pmatrix} a_0 & a_3 \\\\ a_3 & a_0 \\end{pmatrix} = a_0^2 - a_3^2 = 0.05^2 - 1^2 = -0.9975$$
$$b_2 = \\det \\begin{pmatrix} a_0 & a_1 \\\\ a_3 & a_2 \\end{pmatrix} = a_0 a_2 - a_3 a_1 = (-0.05)(-1.2) - (1)(0.47) = 0.06 - 0.47 = -0.41$$
需满足 $|b_0| > |b_2|$：
$$|-0.9975| = 0.9975 > |-0.41| = 0.41 \\quad (\\text{满足！})$$
所有四项朱利判据全部严格满足，因此系统所有特征极点全部位于单位圆内，系统渐近稳定。故选 A。`},{id:"ss-c5-33",subject:"广工837/809-信号与系统",chapter:"第五章：Z变换与离散系统",section:"逆z变换长除法展开",type:"single",difficulty:3,tags:["小马哥960题","长除法","逆z变换","因果序列幂级数"],source:"小马哥《信号与系统960题》第5章",stem:"已知因果离散信号的 $z$ 变换为 $X(z) = \\frac{1 + 2z^{-1}}{1 - 0.5z^{-1}}$，收敛域为 $|z| > 0.5$。采用长除法（降幂展开法）求其对应时域序列的前三项样值 $x[0], x[1], x[2]$ 分别为（ ）。",options:[{key:"A",text:"$x[0] = 1, x[1] = 2.5, x[2] = 1.25$"},{key:"B",text:"$x[0] = 1, x[1] = 2, x[2] = 0.5$"},{key:"C",text:"$x[0] = 0, x[1] = 1, x[2] = 2.5$"},{key:"D",text:"$x[0] = 1, x[1] = 1.5, x[2] = 0.75$"}],answer:"A",analysis:`【核心考点】：单边因果序列长除法（按 $z^{-1}$ 升幂/降幂展开为多项式）。
因果序列定义为 $X(z) = \\sum_{k=0}^{\\infty} x[k] z^{-k} = x[0] + x[1]z^{-1} + x[2]z^{-2} + \\dots$
进行多项式长除：
- 第一步：以 $(1 + 2z^{-1})$ 除以 $(1 - 0.5z^{-1})$，首项为 $\\frac{1}{1} = 1$；
- 减去 $1 \\times (1 - 0.5z^{-1}) = 1 - 0.5z^{-1}$，余项为 $(2 - (-0.5))z^{-1} = 2.5z^{-1}$；
- 第二步：以 $2.5z^{-1}$ 除以 $1$，商为 $2.5z^{-1}$；
- 减去 $2.5z^{-1}(1 - 0.5z^{-1}) = 2.5z^{-1} - 1.25z^{-2}$，余项为 $1.25z^{-2}$；
- 第三步：以 $1.25z^{-2}$ 除以 $1$，商为 $1.25z^{-2}$。
因此多项式展开为：
$$X(z) = 1 + 2.5z^{-1} + 1.25z^{-2} + \\dots$$

学科: 广工837/809-信号与系统

难度: 3
标签: 冲激偶函数, 微分性质, 高频考点
题干:
计算广义定积分 $\\int_{-\\infty}^{+\\infty} (1 - x)\\delta'(x) \\, dx$ 的数值为：
A. -1
B. 0
C. 1
D. 2
答案: C
解析:
由冲激偶函数 $\\delta'(t)$ 的导数筛选性质：
$$\\int_{-\\infty}^{+\\infty} f(t)\\delta'(t) \\, dt = -f'(0)$$
在本题中，设 $f(x) = 1 - x$，对 $x$ 求导得到：
$$f'(x) = -1 \\implies f'(0) = -1$$
代入积分公式得：
$$\\int_{-\\infty}^{+\\infty} (1 - x)\\delta'(x) \\, dx = -(-1) = 1$$
故正确答案为 C。

### 题目 2 [判断]

线性时不变（LTI）因果离散系统稳定的充分必要条件是系统函数 $H(z)$ 的所有极点都严格落在单位圆内（即 $|z_p| < 1$）。
A. 正确（True）
B. 错误（False）
答案: A
解析:
因果离散系统的收敛域 ROC 为外域 $|z| > \\max_i |z_i|$。
而系统稳定的充要条件是收敛域 ROC 包含单位圆 $|z| = 1$。
